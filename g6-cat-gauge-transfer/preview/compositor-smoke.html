<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compositor Smoke Test</title>
</head>
<body>
  <h1>Compositor Smoke Test</h1>
  <div id="result">RUNNING...</div>
  <script src="config.js"></script>
  <script src="preview.js"></script>
  <script>
    (async function() {
      try {
        // Check Canvas 2D support
        const testCanvas = document.createElement('canvas');
        if (!testCanvas.getContext) {
          throw new Error('Canvas 2D not supported in this browser');
        }

        // Load all images
        const config = window.WATCHFACE_CONFIG;
        const layerNames = ['background', 'battery', 'steps', 'progress', 'hour', 'minute', 'second'];
        const images = {};

        for (const name of layerNames) {
          try {
            images[name] = await window.loadImage(config.layers[name].src);
          } catch (err) {
            throw new Error('Failed to load image for ' + name + ': ' + err.message);
          }
        }

        // Render a test frame
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 466;
        const ctx = canvas.getContext('2d');

        await window.renderWatchface(ctx, images, {
          hour: 10, minute: 8, second: 30,
          battery: 4, steps: 5, progress: 6
        });

        // Verify multiple points to avoid false negative with transparent backgrounds
        const points = [[233, 233], [100, 100], [366, 366], [100, 366], [366, 100]];
        let hasVisiblePixel = false;
        for (const [x, y] of points) {
          if (ctx.getImageData(x, y, 1, 1).data[3] > 0) { hasVisiblePixel = true; break; }
        }
        if (!hasVisiblePixel) throw new Error('no visible pixels in canvas');

        // Verify hands are visible in expected positions
        const handPoints = [[233, 100], [233, 366], [100, 233], [366, 233]];
        let handPixels = 0;
        for (const [x, y] of handPoints) {
          if (ctx.getImageData(x, y, 1, 1).data[3] > 0) handPixels++;
        }
        if (handPixels < 2) throw new Error('hands not visible in expected positions');

        document.getElementById('result').textContent = 'PASS';
        document.body.setAttribute('data-status', 'pass');
      } catch (err) {
        document.getElementById('result').textContent = 'FAIL: ' + err.message;
        document.body.setAttribute('data-status', 'fail');
        console.error(err);
      }
    })();
  </script>
</body>
</html>
