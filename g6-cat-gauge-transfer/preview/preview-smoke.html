<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview Smoke Test</title>
</head>
<body>
  <h1>Preview Smoke Test</h1>
  <div id="result">RUNNING...</div>
  <script src="config.js"></script>
  <script>
    (function() {
      try {
        var config = window.WATCHFACE_CONFIG;
        if (!config) throw new Error('WATCHFACE_CONFIG not found');

        // Check canvas size
        if (config.width !== 466 || config.height !== 466) {
          throw new Error('canvas size: expected 466x466, got ' + config.width + 'x' + config.height);
        }

        // Check required layers exist and have non-empty src
        var required = ['background', 'hour', 'minute', 'second'];
        for (var i = 0; i < required.length; i++) {
          var name = required[i];
          var layer = config.layers[name];
          if (!layer) throw new Error('missing layer: ' + name);
          if (!layer.src) throw new Error('missing src for layer: ' + name);
        }

        // Check all expected layers are present
        var expectedLayers = ['background', 'battery', 'steps', 'progress', 'hour', 'minute', 'second'];
        for (var j = 0; j < expectedLayers.length; j++) {
          if (!config.layers[expectedLayers[j]]) {
            throw new Error('missing expected layer: ' + expectedLayers[j]);
          }
        }

        // Verify asset files exist (fetch check)
        var checks = [];
        for (var k = 0; k < expectedLayers.length; k++) {
          (function(layerName) {
            checks.push(
              fetch(config.layers[layerName].src)
                .then(function(res) {
                  if (!res.ok) throw new Error('asset not found: ' + config.layers[layerName].src);
                })
            );
          })(expectedLayers[k]);
        }

        Promise.all(checks).then(function() {
          document.getElementById('result').textContent = 'PASS';
          document.body.setAttribute('data-status', 'pass');
        }).catch(function(err) {
          document.getElementById('result').textContent = 'FAIL: ' + err.message;
          document.body.setAttribute('data-status', 'fail');
        });
      } catch (err) {
        document.getElementById('result').textContent = 'FAIL: ' + err.message;
        document.body.setAttribute('data-status', 'fail');
      }
    })();
  </script>
</body>
</html>
