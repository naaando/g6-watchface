<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G6 Watchface State Smoke Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    h1 { font-size: 1.2rem; margin-bottom: 16px; }
    #result {
      font-size: 1rem;
      padding: 16px 24px;
      border-radius: 8px;
      margin-top: 16px;
    }
    #result.pass { background: #1b5e20; color: #a5d6a7; }
    #result.fail { background: #5e1b1b; color: #ef9a9a; }
    #result.running { background: #1b3a5e; color: #90caf9; }
    pre {
      background: #0d0d1a;
      padding: 16px;
      border-radius: 8px;
      max-width: 600px;
      overflow-x: auto;
      font-size: 0.8rem;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <h1>G6 Watchface State Smoke Test</h1>
  <div id="result" class="running">Running...</div>
  <pre id="log"></pre>

  <script src="config.js"></script>
  <script src="preview.js"></script>
  <script>
    (function() {
      const resultEl = document.getElementById('result');
      const logEl = document.getElementById('log');
      const logs = [];

      function log(msg) {
        logs.push(msg);
        logEl.textContent = logs.join('\n');
      }

      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      try {
        log('Testing createDefaultState()...');
        const state = createDefaultState();
        log('  state = ' + JSON.stringify(state));

        assert(state !== null && typeof state === 'object', 'state should be an object');
        assert(typeof state.hour === 'number', 'hour should be a number');
        assert(typeof state.minute === 'number', 'minute should be a number');
        assert(typeof state.second === 'number', 'second should be a number');
        assert(typeof state.battery === 'number', 'battery should be a number');
        assert(typeof state.steps === 'number', 'steps should be a number');
        assert(typeof state.progress === 'number', 'progress should be a number');
        assert(typeof state.digitalMode === 'boolean', 'digitalMode should be a boolean');

        log('Testing battery range (0-5)...');
        assert(state.battery >= 0 && state.battery <= 5, 'battery range');

        log('Testing steps range (0-9)...');
        assert(state.steps >= 0 && state.steps <= 9, 'steps range');

        log('Testing progress range (0-10)...');
        assert(state.progress >= 0 && state.progress <= 10, 'progress range');

        log('Testing setState({ hour: 3, minute: 15, second: 0 })...');
        setState({ hour: 3, minute: 15, second: 0 });
        const s = getState();
        log('  state after setState = ' + JSON.stringify(s));
        assert(s.hour === 3, 'hour should be 3');
        assert(s.minute === 15, 'minute should be 15');
        assert(s.second === 0, 'second should be 0');

        log('Testing setState preserves other fields...');
        setState({ battery: 2 });
        const s2 = getState();
        assert(s2.battery === 2, 'battery should be 2');
        assert(s2.hour === 3, 'hour should still be 3');
        assert(s2.minute === 15, 'minute should still be 15');

        log('Testing startClock()...');
        const timerId = startClock();
        assert(typeof timerId === 'number', 'startClock should return a number (timer id)');
        log('  timerId = ' + timerId);

        log('Testing stopClock()...');
        stopClock();
        log('  clock stopped');

        log('Testing digitalMode toggle...');
        setState({ digitalMode: true });
        assert(getState().digitalMode === true, 'digitalMode should be true');
        setState({ digitalMode: false });
        assert(getState().digitalMode === false, 'digitalMode should be false');

        log('');
        log('ALL TESTS PASSED');
        resultEl.textContent = 'PASS — All smoke tests passed';
        resultEl.className = 'pass';
      } catch (err) {
        log('');
        log('TEST FAILED: ' + err.message);
        resultEl.textContent = 'FAIL — ' + err.message;
        resultEl.className = 'fail';
      }
    })();
  </script>
</body>
</html>
